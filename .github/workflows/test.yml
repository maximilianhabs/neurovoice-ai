name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die Version im Docker-Image (siehe dashboard/Dockerfile), 3.12 faengt
        # fruehzeitig, was beim naechsten Basis-Image-Sprung brechen wuerde.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Abhängigkeiten der Testsuite
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
      - name: Tests
        run: pytest tests/ -q
