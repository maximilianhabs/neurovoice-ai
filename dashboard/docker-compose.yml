services:
  neurovoice-dashboard:
    build: .
    container_name: neurovoice-dashboard
    restart: unless-stopped
    # P9-Umbau (2026-08-16, docs/konzept_p9_hintergrundjob_lokal.md): WhisperX laeuft jetzt im
    # getrennten neurovoice-worker-Dienst, NICHT mehr direkt im UI-Prozess -- deshalb reicht
    # hier ein deutlich kleineres Limit als vorher (war 7g fuer denselben Container, der auch
    # die Transkription gemacht hat, siehe docs/bugtracker.md INFRA-BEFUND-09).
    mem_limit: 2g
    environment:
      NEUROVOICE_DATA_DIR: /data
      NEUROVOICE_DERIVED_DIR: /derived
    ports:
      # Nur ueber Tailscale erreichbar, wie alle anderen Dienste auf diesem Server.
      - "100.67.129.76:8501:8501/tcp"
    volumes:
      # Read-only: das Dashboard liest nur, es schreibt/loescht keine Rohdaten.
      - /home/maximilian/neurovoice-data/raw:/data:ro
      # Read-write, aber getrennt von den Rohdaten: hier landen abgeleitete Ergebnisse
      # (Transkripte als Cache) UND die Job-Queue (core/job_queue.py) -- geteilt mit
      # neurovoice-worker, damit beide Prozesse denselben Zustand sehen.
      - /home/maximilian/neurovoice-data/derived:/derived
    depends_on:
      - neurovoice-worker

  neurovoice-worker:
    build: .
    container_name: neurovoice-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    # Der Dockerfile-HEALTHCHECK prueft den Streamlit-HTTP-Port -- der Worker laeuft aber
    # nicht als Streamlit-Prozess und haette diesen Port nie, wuerde also immer faelschlich
    # als "unhealthy" angezeigt. Hier bewusst deaktiviert statt eines Fake-Checks.
    healthcheck:
      disable: true
    # Uebernimmt das Speicher-Limit, das vorher fuer die (im UI-Prozess laufende)
    # Transkription galt -- 5g reichte nicht (OOMKilled, INFRA-BEFUND-09), 7g verhindert, dass
    # ein Ladevorgang andere Dienste auf dem 10GB-Server unter Druck setzt (RESSOURCEN.md).
    mem_limit: 7g
    environment:
      NEUROVOICE_DATA_DIR: /data
      NEUROVOICE_DERIVED_DIR: /derived
    volumes:
      - /home/maximilian/neurovoice-data/raw:/data:ro
      - /home/maximilian/neurovoice-data/derived:/derived
      # Modell-Cache persistent, damit large-v3 (~3GB) nicht bei jedem Rebuild neu geladen wird.
      - whisperx-models:/root/.cache

volumes:
  whisperx-models:
