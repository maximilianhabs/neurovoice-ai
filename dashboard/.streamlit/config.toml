[theme]
# Design-Transfer vom EDF-Analyzer (siehe core/design_tokens.py) — bei Änderung dort auch
# hier nachziehen (zwei separate Quellen, Streamlit liest core/design_tokens.py nicht aus).
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
font = "sans serif"

[browser]
# Bereits per CLI-Flag im Dockerfile gesetzt (--browser.gatherUsageStats=false) -- hier
# zusätzlich als Konfigurationsquelle, falls die App je ohne die CLI-Flags gestartet wird.
gatherUsageStats = false

[server]
# Obergrenze auf Streamlit-Ebene, zusätzlich zur eigenen Prüfung in
# core/audio.py::save_uploaded_wav() (MAX_UPLOAD_BYTES) -- zwei unabhängige Schranken statt
# nur einer, falls die App-Grenze mal umgangen/geändert wird ohne diese Datei anzupassen.
maxUploadSize = 25
